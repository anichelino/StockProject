name: Run Stock App

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # ogni 15 minuti, sfalsato dai minuti "affollati"
  workflow_dispatch: {}            # avvio manuale e avvio esterno (cron-job.org)

concurrency:
  group: stock-app
  cancel-in-progress: false        # se un giro e' ancora in corso, il successivo aspetta

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
