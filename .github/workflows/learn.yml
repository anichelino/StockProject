name: Ricalcolo modello

on:
  push:
    branches: [Test_statistic]
  schedule:
    - cron: "40 4 * * *"           # ogni giorno alle 04:40 UTC (solo sul branch principale)
  workflow_dispatch: {}            # avvio manuale

# serve per salvare nel repository l'archivio dei prezzi a 15 minuti (cartella data/)
permissions:
  contents: write

concurrency:
  group: learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ricalcola il modello
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python learn.py

      # Anche se il ricalcolo fallisce, i giorni gia' scaricati vengono salvati
      - name: Salva l'archivio dei prezzi nel repository
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessun giorno nuovo da archiviare."
            exit 0
          fi
          git commit -m "Archivio prezzi 15 minuti $(date -u +%F)"
          git pull --rebase
          git push
